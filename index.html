<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca de Ruth</title>
<meta name="description" content="Ensayos, artículos y libros que he leído y recomiendo, acomodados en un estante que gira.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Biblioteca de Ruth">
<meta property="og:description" content="Ensayos, artículos y libros que he leído y recomiendo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav class="social" aria-label="Perfiles">
  <a href="https://substack.com/@ruthalexandra" target="_blank" rel="noopener me" aria-label="Substack" title="Substack">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 3.5h16v2.2H4zm0 4.2h16v2.2H4zm0 4.2h16v9.1l-8-4.4-8 4.4z"/></svg>
  </a>
  <a href="https://www.instagram.com/generaciondecrystal" target="_blank" rel="noopener me" aria-label="Instagram" title="Instagram">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.4" cy="6.6" r=".9" fill="currentColor" stroke="none"/></svg>
  </a>
  <a href="https://www.youtube.com/@generaciondecristal.1857" target="_blank" rel="noopener me" aria-label="YouTube" title="YouTube">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="2.2" y="5.2" width="19.6" height="13.6" rx="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="currentColor" d="M10 9v6l5.2-3z"/></svg>
  </a>
  <a href="https://alexandracasillascruz-create.github.io/Portfolio/" target="_blank" rel="noopener me" class="cv" data-i18n-label="cv" aria-label="CV y portafolio" title="CV y portafolio">CV</a>
</nav>
<header class="top">
  <div class="masthead">
    <h1 data-i18n="title">Biblioteca de Ruth</h1>
    <p class="lede" id="clock"><time></time></p>
  </div>
  <div class="controls">
    <button class="surprise" id="surprise" type="button" data-i18n="surprise">Sorpréndeme</button>
    <button class="view-toggle" id="viewToggle" type="button" aria-pressed="false" data-i18n="asList">Ver como lista</button>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<div class="search" role="search">
  <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="searchPh" placeholder="¿Qué estás buscando?" aria-label="Buscar por título o autor">
</div>
<p class="no-results" id="noResults" hidden></p>
<nav class="topics" id="topics" aria-label="Temas"></nav>

<main>
  <section class="scene" id="scene" aria-label="Estante">
    <canvas id="shelfCanvas" aria-hidden="true"></canvas>
    <div class="sr-only" id="srBooks" role="group"></div>
    <p class="hint" id="hint" data-i18n="hint">Arrastra para girar el estante. Toca un libro para abrirlo.</p>
  </section>
  <section class="list" id="list" hidden></section>
</main>

<div class="reader" id="reader" hidden>
  <div class="reader-backdrop" data-close></div>
  <article class="spread" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
    <div class="page page-cover" id="readerCover"></div>
    <div class="page page-text">
      <button class="close" type="button" data-close aria-label="Cerrar">×</button>
      <p class="kind" id="readerKind"></p>
      <h2 id="readerTitle"></h2>
      <p class="byline" id="readerByline"></p>
      <p class="desc" id="readerDesc"></p>
      <p class="status" id="readerStatus"></p>
      <p class="actions" id="readerActions"></p>
    </div>
  </article>
</div>

<footer class="foot">
  <p id="count"></p>
</footer>
<script src="assets/app.js" type="module"></script>
</body>
</html>
